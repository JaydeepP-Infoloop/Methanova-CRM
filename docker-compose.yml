services:
  mongo:
    image: mongo:7
    container_name: methanova-mongo
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    volumes:
      - methanova_mongo_data:/data/db
      - ./scripts/mongo-rs-init.sh:/docker-entrypoint-initdb.d/mongo-rs-init.sh:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "try { rs.status().ok } catch (e) { 0 }"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  methanova_mongo_data:
